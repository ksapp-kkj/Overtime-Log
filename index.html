<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>残業時間管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ヘッダー -->
  <header class="main-header">
    <h1>残業時間管理アプリ</h1>
    <button id="open-settings" class="header-setting-btn">⚙️ 設定</button>
  </header>

  <main class="container">
    
    <!-- 左側エリア：サマリーと入力 -->
    <div class="left-col">
      <section id="summary-section" class="card">
        <h2>月度サマリー</h2>
        <div class="input-group">
          <label>今日の日付：</label>
          <span id="today-date"></span>
        </div>
        <div class="input-group">
          <label>対象月度：</label>
          <span id="current-month"></span>
        </div>
        <div class="input-group">
          <label>対象期間：</label>
          <span id="current-period"></span>
        </div>
        <div class="input-group flex-group">
          <label>出勤日数：</label>
          <span id="work-days-display" class="highlight-text">0</span> 日
        </div>
        <div class="input-group flex-group">
          <label>有給取得：</label>
          <span id="paid-leave-display" class="highlight-text" style="color: #48bb78;">0</span> 日
        </div>
        <div class="summary-result highlight-box">
          <div class="summary-label">今月の残業時間合計</div>
          <div class="summary-time" id="total-overtime">0時間00分</div>
        </div>
      </section>

      <section id="input-section" class="card">
        <h2>日々の入力</h2>
        <form id="work-form">
          <div class="input-group">
            <label for="work-date">日付：</label>
            <input type="date" id="work-date" required>
          </div>
          <div class="input-group flex-group">
            <label>出勤時間：</label>
            <select id="start-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
            <select id="start-time-m" class="time-select"></select>
          </div>
          <div class="input-group flex-group">
            <label>退勤時間：</label>
            <select id="end-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
            <select id="end-time-m" class="time-select"></select>
          </div>
          <button type="submit" class="btn">登録</button>
        </form>
      </section>
    </div>

    <!-- 右側エリア：カレンダー履歴 -->
    <div class="right-col">
      <section id="calendar-section" class="card">
        <div class="calendar-header" style="flex-direction: column;">
          <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <button id="prev-month" class="btn-small">◀︎ 先月度</button>
            <h2 id="calendar-title"></h2>
            <button id="next-month" class="btn-small">来月度 ▶︎</button>
          </div>
          <button id="toggle-holiday-mode-btn" class="btn-small holiday-setting-btn">休日・有給を設定する</button>
          <button id="toggle-calendar-btn" class="btn-small mobile-only" style="margin-top: 10px;">カレンダーを開く ▼</button>
        </div>
        
        <!-- ★ 変更：案内の文字色を赤から青（#3182ce）に変更 -->
        <p id="holiday-mode-guide" class="setting-note center-text hidden" style="margin: 10px 0 5px; color: #3182ce; font-weight: bold;">
          日付をタップして切り替え（休日 ➔ 有給 ➔ 勤務日）
        </p>

        <div class="calendar-grid">
          <!-- JSでここに日付セルが追加される -->
        </div>
      </section>
    </div>

  </main>

  <!-- 吹き出し（ツールチップ）用の隠し要素 -->
  <div id="tooltip" class="tooltip hidden">
    <div class="tooltip-content"></div>
    <button id="tooltip-close">閉じる</button>
  </div>

  <!-- 設定用モーダル画面 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content card">
      <h2>アプリ設定</h2>
      
      <h3 class="modal-sub-title" style="margin-top: 10px;">基本の勤務時間</h3>
      <p class="setting-note center-text">※毎日の入力フォームの初期値になります</p>
      <div class="input-group flex-group">
        <label class="setting-label" style="width: 80px;">出勤：</label>
        <select id="setting-start-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
        <select id="setting-start-time-m" class="time-select"></select>
      </div>
      <div class="input-group flex-group" style="margin-bottom: 20px;">
        <label class="setting-label" style="width: 80px;">退勤：</label>
        <select id="setting-end-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
        <select id="setting-end-time-m" class="time-select"></select>
      </div>
      
      <hr class="modal-divider">

      <h3 class="modal-sub-title">月度の設定</h3>
      <div class="input-group flex-group" style="justify-content: center;">
        <label for="start-day-setting" class="setting-label">開始日：</label>
        <input type="number" id="start-day-setting" min="1" max="31" value="21" class="short-input">
        <span>日</span>
      </div>
      
      <div class="modal-buttons" style="margin-top: 25px;">
        <button id="save-settings" class="btn modal-btn save-btn">保存</button>
        <button id="close-settings" class="btn modal-btn cancel-btn">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- データ編集用モーダル画面 -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content card">
      <h2>記録の編集・削除</h2>
      <p id="edit-date-display"></p>
      <div class="input-group flex-group">
        <label class="setting-label">出勤時間：</label>
        <select id="edit-start-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
        <select id="edit-start-time-m" class="time-select"></select>
      </div>
      <div class="input-group flex-group">
        <label class="setting-label">退勤時間：</label>
        <select id="edit-end-time-h" class="time-select"></select><span style="margin: 0 5px;">:</span>
        <select id="edit-end-time-m" class="time-select"></select>
      </div>
      <div class="modal-buttons edit-modal-buttons">
        <button id="save-edit-btn" class="btn modal-btn save-btn">保存</button>
        <button id="delete-edit-btn" class="btn modal-btn delete-btn">削除</button>
        <button id="cancel-edit-btn" class="btn modal-btn cancel-btn">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
